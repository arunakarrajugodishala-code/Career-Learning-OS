posable Linux environment.","What does pwd show?","Current working directory"]},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Files and paths","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Permissions","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Processes","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Services","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Packages","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Shell variables","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Bash scripts","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"IP addressing","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"DNS","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"HTTP and TLS","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"Ports and firewalls","detail":null},{"subject":"Foundations","source":"https://linuxjourney.com/","topic":"SSH","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic":"Git init and commits","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic":"Branches","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic":"Merge conflicts","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic":"Pull requests","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic":"Git remotes","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic":"Python variables","detail":null},{"subject":"Engineering basics","source":"https://skills.github.com/","topic" l},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"RDS","detail":null},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"Load balancing","detail":null},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"Auto Scaling","detail":null},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"Route 53","detail":null},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"CloudWatch","detail":null},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"AWS budgets","detail":null},{"subject":"AWS","source":"https://docs.aws.amazon.com/","topic":"AWS architecture review","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Docker images","detail":["Docker images","An image is an immutable packaged filesystem and metadata. A container is a running instance with a writable layer. Rebuild images rather than modifying production containers.","Dockerfile → image → container","Build a local nginx image or run nginx with a local port mapping; inspect and remove the container.","What is a container?","A running instance of an image"]},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Dockerfile","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Containers","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Volumes","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Docker networks","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Compose","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","topic":"Registries","detail":null},{"subject":"Automation","source":"https://developer.hashicorp.com/terraform/tutorials","to "topic":"Jobs and steps","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Runners","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Artifacts","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Secrets and OIDC","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Matrix builds","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Deployment environments","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Rollback","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Azure Pipelines","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Kubernetes architecture","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Pods","detail":["Pods","A pod is Kubernetes' smallest deployable unit. Its containers share networking and can share volumes. Controllers replace failed pods rather than relying on a permanent pod identity.","Deployment → ReplicaSet → Pod","Use a local kind cluster; create a deployment, delete a pod and observe replacement.","Which controller maintains replicas?","ReplicaSet"]},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Deployments","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"Services","detail":null},{"subject":"CI/CD","source":"https://docs.github.com/en/actions","topic":"ConfigMaps and Secrets","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Namespaces and RBAC","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Probes","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Resource limits","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Persistent volumes","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Ingress","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Helm","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Argo CD","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"GitOps","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Prometheus","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Grafana","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Logs","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Distributed traces","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Incident response","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Supply chain security","detail":null},{"subject":"Production","source":"https://kubernetes.io/docs/","topic":"Production project","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"LLM fundamentals","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"Tokens and context","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"Prompt design","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"Embeddings","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"Vector search","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"RAG","detail":["RAG","Retrieval augmented generation retrieves relevant documents and supplies them as context to a language model. Retrieval quality and answer grounding must be evaluated separately.","Question → retrieval → context → model → answer","Use synthetic documents; retrieve matching passages and compare answers with and without context.","Does RAG retrain the model?","No, it supplies external context"]},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"RAG evaluation","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"MCP","detail":["MCP","Model Context Protocol standardises communication between AI applications and servers exposing tools, resources or prompts. Tool calls require appropriate authorisation and untrusted content must not override instructions.","Host → client → MCP server → tool","Sketch a read-only synthetic incident lookup tool and its permission boundary.","Should retrieved text grant permissions?","No"]},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"Tool permissions","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"AI Foundry","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"AIOps anomaly detection","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"AI incident triage","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"Human approval","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"AI security","detail":null},{"subject":"AI operations","source":"https://learn.microsoft.com/en-us/azure/ai-foundry/","topic":"AI operations project","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"AWS secure architecture","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"AWS resilient architecture","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"AWS performance","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"AWS cost optimisation","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Terraform exam review","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"GitHub Actions exam review","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Kubernetes exam review","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Linux interview","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Networking interview","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Cloud interview","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"DevOps interview","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Portfolio README","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Technical presentation","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"UK job and sponsorship checks","detail":null},{"subject":"Career","source":"https://aws.amazon.com/certification/","topic":"Final capstone","detail":["Final capstone","A production-style portfolio should show reproducible infrastructure, automated tests, deployment, observability, security and recovery. Use synthetic data and document limitations.","Git → CI → image → deployment → monitoring → rollback","Record a demo of your synthetic care application; include test output, architecture, failure recovery and cost controls.","What proves recovery?","Evidence of a tested rollback or restore"]}];let state=JSON.parse(localStorage.getItem('devops120-v1')||'{}');const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('devops120-v1',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));data.forEach((d,i)=>$('day').add(new Option('Day '+(i+1)+' · '+d.topic,i)));function progress(){let n=Object.values(state).filter(x=>x.pass).length;$('progress').innerHTML='<progress max="120" value="'+n+'"></progress>'+n+' / 120 passed'}function render(){let i=+$('day').value,d=data[i],s=state[i]||{},x=d.detail;progress();$('main').innerHTML='<section><small>'+esc(d.subject)+' · Day '+(i+1)+'</small><h2>'+esc(d.topic)+'</h2><p>Study cycle: 10 min recall, 30 min reading, 20 min video, 45 min lab, 15 min assessment.</p><p><a href="'+d.source+'">Reference learning material</a> · <a href="https://www.youtube.com/results?search_query='+encodeURIComponent(d.topic+' explained in 5 minutes')+'">Short video search</a> · <a href="https://www.youtube.com/results?search_query='+encodeURIComponent(d.topic+' full practical tutorial')+'">Long video search</a></p></section>'+(!x?'<section><h3>Lesson not yet authored</h3><p>Use the reference material for independent study. This day cannot be passed until detailed notes, lab and assessment are authored.</p></section>':'<section><h3>Detailed notes</h3><p>'+esc(x[1])+'</p><h3>Visual working notes</h3><svg viewBox="0 0 700 90" role="img" aria-label="'+esc(x[2])+'"><rect x="4" y="8" width="692" height="74" rx="12" fill="#e1edf9"/><text x="350" y="49" text-anchor="middle" font-size="17">'+esc(x[2])+'</text></svg><h3>Short notes / daily summary</h3><p>'+esc(x[2])+'</p><h3>Practical lab</h3><p>'+esc(x[3])+'</p><label>Lab evidence and teach-back<textarea id="evidence">'+esc(s.evidence)+'</textarea></label><h3>Recall quiz</h3><p>'+esc(x[4])+'</p><input id="answer" placeholder="Your answer"><button id="check">Check answer and save</button><p id="feedback"></p><p>Review this lesson after 1, 3, 7, 14 and 30 days.</p></section>');if(x)$('check').onclick=()=>{let evidence=$('evidence').value.trim(),answer=$('answer').value.trim(),correct=answer.toLowerCase()===x[5].toLowerCase();state[i]={evidence,pass:false,recall:correct,review:new Date().toISOString()};save();$('feedback').textContent=(correct?'Recall matched.':'Model answer: '+x[5])+ ' Lab evidence saved; independent practical verification and full assessment are not implemented, so mastery remains unverified.';progress()}}$('day').onchange=render;$('audit').onclick=()=>{$('main').innerHTML='<section><h2>Coverage audit — incomplete</h2><p>'+data.filter(d=>d.detail).length+' / 120 days have starter notes, a lab and a recall question. All 120 have topics and resource links. No day has a verified full assessment, curated videos, or official exam objective mapping.</p><p>Missing detailed lessons:</p>'+data.map((d,i)=>d.detail?'':'<div>Day '+(i+1)+' · '+esc(d.topic)+'</div>').join('')+'</section>'};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='devops-progress.json';a.click();URL.revokeObjectURL(a.href)};$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v||typeof v!=='object'||Array.isArray(v))throw Error();state=Object.fromEntries(Object.entries(v).filter(([k,x])=>/^\d+$/.test(k)&&+k<120&&x&&typeof x==='object').map(([k,x])=>[k,{evidence:String(x.evidence||''),pass:false,recall:!!x.recall,review:String(x.review||'')} ]));save();render()}catch{alert('Invalid backup')}};render();</script></html>
