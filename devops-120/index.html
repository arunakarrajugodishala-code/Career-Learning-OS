<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevOps, Cloud &amp; AI Career Academy</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 17px/1.55 system-ui, sans-serif; background: #f3f5ef; color: #172b26; margin: auto; max-width: 920px; padding: 20px; }
    header, section { background: #fff; border: 1px solid #d7e0d6; border-radius: 14px; padding: clamp(16px, 4vw, 32px); margin-bottom: 16px; }
    header { background: #123b31; color: #fff; }
    header a { color: #cfefbf; }
    a { color: #175b42; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { font-size: clamp(28px, 6vw, 46px); margin-bottom: 12px; }
    label { display: block; margin: 8px 0; }
    button, select, input, textarea { font: inherit; max-width: 100%; }
    button, select { padding: 9px 12px; border: 1px solid #809c88; border-radius: 6px; margin: 4px 0; }
    button { background: #195640; color: white; cursor: pointer; }
    input[type=file] { color: inherit; display: block; }
    textarea { display: block; width: 100%; padding: 8px; }
    pre { overflow: auto; padding: 14px; background: #edf2eb; border-radius: 8px; font-size: .88rem; }
    progress { display: block; width: 100%; accent-color: #78ab5e; }
    .controls, .flow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .flow { list-style-position: inside; padding: 0; }
    .flow li { background: #e5f1e2; border: 1px solid #bfd3bc; border-radius: 6px; padding: 8px 12px; }
    fieldset { border: 1px solid #c5d4c6; margin: 14px 0; border-radius: 8px; min-width: 0; }
    details { margin: 12px 0; }
    summary { cursor: pointer; }
  </style>
  <script defer src="curriculum.js"></script>
  <script defer src="foundations.js"></script>
  <script defer src="academy.js"></script>
</head>
<body>
  <header>
    <a href="../">Career Learning OS</a>
    <h1>DevOps, Cloud &amp; AI Career Academy</h1>
    <p>120-day planner · 10 expanded foundations lessons</p>
    <div id="progress"></div>
    <label for="day">Choose a lesson</label>
    <select id="day"></select>
    <div class="controls">
      <button id="resume">Resume learning</button>
      <button id="revisions">Revision queue</button>
      <button id="audit">Coverage checker</button>
      <button id="backup">Export progress</button>
    </div>
    <label for="restore">Restore a progress backup</label>
    <input id="restore" type="file" accept=".json,application/json">
    <p id="status" role="status" hidden></p>
  </header>
  <main id="main"></main>
</body>
</html>
